<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立和设计 · 统一登录</title>
<style>
  :root {
    --sage: #5A7D6B;
    --sage-dark: #3F5D50;
    --sage-bg: #F0F4F2;
    --accent: #5A7D6B;
    --accent-light: #7BA68B;
    --bg: #FAFBF9;
    --card: #FFFFFF;
    --text: #2C3E35;
    --text-light: #8A9A92;
    --border: #E0E5E2;
    --danger: #E74C3C;
    --shadow: 0 2px 16px rgba(90,125,107,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-container {
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
  }

  /* Header */
  .login-header {
    background: linear-gradient(135deg, var(--sage-dark), var(--sage));
    padding: 36px 32px 28px;
    text-align: center;
    color: #fff;
  }
  .logo-box {
    width: 64px; height: 64px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
    font-size: 30px; font-weight: 700;
  }
  .login-header h1 { font-size: 22px; margin-bottom: 4px; }
  .login-header p { font-size: 13px; opacity: 0.8; }

  /* Role Selection */
  .role-section { padding: 28px 32px 16px; }
  .role-section .label {
    font-size: 14px; font-weight: 600; color: var(--text);
    margin-bottom: 14px; text-align: center;
  }
  .role-cards {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .role-card {
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg);
  }
  .role-card:active { transform: scale(0.96); }
  .role-card .icon { font-size: 28px; margin-bottom: 6px; }
  .role-card .name { font-size: 14px; font-weight: 600; color: var(--text); }
  .role-card .desc { font-size: 11px; color: var(--text-light); margin-top: 2px; }
  .role-card.active {
    border-color: var(--sage);
    background: var(--sage-bg);
    box-shadow: 0 2px 8px rgba(90,125,107,0.15);
  }
  .role-card.active .name { color: var(--sage-dark); }

  /* Form */
  .form-section { padding: 8px 32px 28px; }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 13px; color: var(--text-light);
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    transition: border-color 0.2s;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--sage);
  }
  .login-btn {
    width: 100%;
    padding: 15px;
    background: var(--sage);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
  }
  .login-btn:active { background: var(--sage-dark); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Hint */
  .hint {
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--sage-bg);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.8;
  }
  .hint b { color: var(--sage-dark); }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Hidden by default */
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="login-container">
  <!-- Header -->
  <div class="login-header">
    <div class="logo-box">立</div>
    <h1>立和设计</h1>
    <p>自动化运营管理系统</p>
  </div>

  <!-- Role Selection -->
  <div class="role-section">
    <div class="label">请选择您的身份</div>
    <div class="role-cards">
      <div class="role-card active" data-role="client" onclick="selectRole('client')">
        <div class="icon">🏠</div>
        <div class="name">客户</div>
        <div class="desc">查看进度</div>
      </div>
      <div class="role-card" data-role="staff" onclick="selectRole('staff')">
        <div class="icon">👷</div>
        <div class="name">员工</div>
        <div class="desc">上传管理</div>
      </div>
      <div class="role-card" data-role="boss" onclick="selectRole('boss')">
        <div class="icon">📊</div>
        <div class="name">管理</div>
        <div class="desc">全局后台</div>
      </div>
    </div>
  </div>

  <!-- Form -->
  <div class="form-section">
    <!-- Client Form -->
    <div id="clientForm">
      <div class="form-group">
        <label>手机号</label>
        <input class="form-input" id="phoneInput" type="tel" placeholder="请输入您的手机号" maxlength="11">
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">查看我的项目</button>
      <div class="hint">📱 输入您在立和登记的手机号，即可查看所有项目进度和确认节点</div>
    </div>

    <!-- Staff Form -->
    <div id="staffForm" class="hidden">
      <div class="form-group">
        <label>工号</label>
        <input class="form-input" id="staffIdInput" type="text" placeholder="S01~S06">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="form-input" id="staffPwdInput" type="password" placeholder="请输入密码">
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
      <div class="hint">
        <b>员工账号：</b><br>
        S01 庄涛(设计师) · S02 林协莎(设计师) · S03 颜大然(软装) · S04 王润鹏(施工图) · S05 谢佳润(监理) · S06 谢建彬(监理)<br>
        默认密码：<b>lihe2026</b>
      </div>
    </div>

    <!-- Boss Form -->
    <div id="bossForm" class="hidden">
      <div class="form-group">
        <label>管理员账号</label>
        <input class="form-input" id="bossIdInput" type="text" placeholder="B01" value="B01">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="form-input" id="bossPwdInput" type="password" placeholder="请输入密码">
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
      <div class="hint"><b>管理员账号：B01</b> · 默认密码：<b>lihe2026</b></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = new URLSearchParams(window.location.search).get('api')
    || (window.location.hostname === 'localhost'
        ? 'http://localhost:3000'
        : window.location.origin);

  let currentRole = 'client';

  // ===== Role Selection =====
  function selectRole(role) {
    currentRole = role;
    document.querySelectorAll('.role-card').forEach(c => {
      c.classList.toggle('active', c.dataset.role === role);
    });
    document.getElementById('clientForm').classList.toggle('hidden', role !== 'client');
    document.getElementById('staffForm').classList.toggle('hidden', role !== 'staff');
    document.getElementById('bossForm').classList.toggle('hidden', role !== 'boss');

    // Auto-fill for boss
    if (role === 'boss') {
      document.getElementById('bossIdInput').value = 'B01';
    }
  }

  // ===== Login =====
  async function doLogin() {
    const btn = document.querySelector('#loginBtn:not(.hidden)') || document.getElementById('loginBtn');
    // Find visible form's button
    const activeForm = ['clientForm', 'staffForm', 'bossForm'].find(id => !document.getElementById(id).classList.contains('hidden'));
    const activeBtn = activeForm ? activeForm.querySelector('button') : null;

    if (activeBtn) { activeBtn.disabled = true; activeBtn.textContent = '验证中...'; }

    try {
      if (currentRole === 'client') {
        await loginClient();
      } else if (currentRole === 'staff') {
        await loginStaff();
      } else if (currentRole === 'boss') {
        await loginBoss();
      }
    } catch (err) {
      showToast(err.message || '登录失败');
    } finally {
      if (activeBtn) { activeBtn.disabled = false; activeBtn.textContent = '登 录'; }
    }
  }

  // ===== Client Login =====
  async function loginClient() {
    const phone = document.getElementById('phoneInput').value.trim();
    if (!phone || phone.length < 11) {
      showToast('请输入正确的手机号');
      return;
    }

    const resp = await fetch(`${API_BASE}/api/project?phone=${encodeURIComponent(phone)}`);
    const data = await resp.json();
    if (data.success) {
      localStorage.setItem('lihe_role', 'client');
      localStorage.setItem('lihe_phone', phone);
      window.location.href = '/client.html?autologin=1';
    } else {
      throw new Error(data.message || '未找到关联项目');
    }
  }

  // ===== Staff Login =====
  async function loginStaff() {
    const staffId = document.getElementById('staffIdInput').value.trim().toUpperCase();
    const password = document.getElementById('staffPwdInput').value.trim();
    if (!staffId || !password) {
      showToast('请输入工号和密码');
      return;
    }

    const resp = await fetch(`${API_BASE}/api/project?staffId=${staffId}&password=${encodeURIComponent(password)}`);
    if (resp.status === 401) throw new Error('工号或密码错误');
    const data = await resp.json();
    if (data.success) {
      localStorage.setItem('lihe_role', 'staff');
      localStorage.setItem('lihe_staffId', staffId);
      localStorage.setItem('lihe_password', password);
      localStorage.setItem('lihe_staffName', data.staffName || '');
      localStorage.setItem('lihe_staffRole', data.staffRole || '');
      window.location.href = '/staff.html?autologin=1';
    } else {
      throw new Error(data.error || '登录失败');
    }
  }

  // ===== Boss Login =====
  async function loginBoss() {
    const bossId = document.getElementById('bossIdInput').value.trim();
    const password = document.getElementById('bossPwdInput').value.trim();
    if (!bossId || !password) {
      showToast('请输入账号和密码');
      return;
    }

    const resp = await fetch(`${API_BASE}/api/boss?staffId=${encodeURIComponent(bossId)}&password=${encodeURIComponent(password)}`);
    const data = await resp.json();
    if (data.success) {
      localStorage.setItem('lihe_role', 'boss');
      localStorage.setItem('lihe_staffId', bossId);
      localStorage.setItem('lihe_password', password);
      window.location.href = '/boss.html?autologin=1';
    } else {
      throw new Error(data.error || '账号或密码错误');
    }
  }

  // ===== Toast =====
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ===== Enter key =====
  document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') doLogin();
  });

  // ===== Auto-redirect if already logged in =====
  const savedRole = localStorage.getItem('lihe_role');
  if (savedRole === 'client' && localStorage.getItem('lihe_phone')) {
    window.location.href = '/client.html?autologin=1';
  } else if (savedRole === 'staff' && localStorage.getItem('lihe_staffId')) {
    window.location.href = '/staff.html?autologin=1';
  } else if (savedRole === 'boss' && localStorage.getItem('lihe_staffId')) {
    window.location.href = '/boss.html?autologin=1';
  }
</script>
</body>
</html>
