<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立和设计 · 项目协同平台</title>
<style>
  :root {
    /* v3 Warm Premium Palette */
    --warm-bg: #F2EFE9;
    --warm-header: #EDE9E0;
    --warm-deco: #E3DDD0;
    --white: #FFFFFF;
    --sage: #4A6B5A;
    --sage-dark: #3A5648;
    --sage-light: #6A8B7A;
    --sage-bg: #E8EDE9;
    --gold: #A8884F;
    --gold-light: #C4A87A;
    --gold-bg: #F5F0E6;
    --text-main: #2A3A30;
    --text-secondary: #5A6B62;
    --text-light: #8A9B92;
    --text-placeholder: #B0ABA0;
    --border: #D8D5CD;
    --border-light: #E8E5DF;
    --danger: #C75B5B;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --radius-full: 9999px;
    --shadow-sm: 0 2px 8px rgba(42, 58, 48, 0.04);
    --shadow-md: 0 4px 16px rgba(42, 58, 48, 0.08);
    --shadow-lg: 0 12px 32px rgba(42, 58, 48, 0.12);
    --shadow-xl: 0 24px 56px rgba(42, 58, 48, 0.16);
    --serif: Georgia, 'Times New Roman', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--warm-bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Subtle warm decorative shapes */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 300px; height: 300px;
    background: var(--warm-deco);
    top: -80px; right: -80px;
  }
  body::after {
    width: 260px; height: 260px;
    background: var(--warm-deco);
    bottom: -60px; left: -60px;
  }

  .login-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
  }

  .login-card {
    background: var(--white);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-xl);
    overflow: hidden;
    border: 0.5px solid var(--border);
    animation: cardEnter 0.6s ease-out;
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Header - Warm grey with decorative ellipses + wave bottom ===== */
  .login-header {
    background: var(--warm-header);
    padding: 44px 32px 48px;
    text-align: center;
    color: var(--text-main);
    position: relative;
    overflow: hidden;
  }

  /* Decorative ellipses */
  .login-header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    background: var(--warm-deco);
    border-radius: 50%;
    opacity: 0.6;
  }
  .login-header::after {
    content: '';
    position: absolute;
    top: 20px; left: -30px;
    width: 100px; height: 100px;
    background: var(--warm-deco);
    border-radius: 50%;
    opacity: 0.4;
  }

  /* Wave bottom */
  .wave-bottom {
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    line-height: 0;
    pointer-events: none;
  }
  .wave-bottom svg {
    width: 100%; height: 20px;
    display: block;
  }

  /* Gold double-ring logo */
  .logo-ring {
    width: 104px; height: 104px;
    margin: 0 auto 18px;
    padding: 5px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    background: var(--white);
    position: relative;
    z-index: 1;
    box-shadow: 0 4px 16px rgba(168, 136, 79, 0.15);
  }
  .logo-ring::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px solid var(--gold-light);
    border-radius: 50%;
    opacity: 0.5;
  }

  .logo-box {
    width: 100%; height: 100%;
    background: var(--warm-header);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  .logo-box img {
    width: 64%; height: 64%;
    object-fit: contain;
  }

  .login-header h1 {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 500;
    color: var(--text-main);
    letter-spacing: 2px;
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
  }

  .login-header .slogan {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
  }

  /* Gold short divider */
  .gold-divider {
    width: 36px; height: 1.5px;
    background: var(--gold);
    margin: 0 auto;
    border-radius: 1px;
    position: relative;
    z-index: 1;
  }

  /* ===== Role Selection ===== */
  .role-section {
    padding: 28px 32px 18px;
  }

  .role-section .label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-light);
    margin-bottom: 14px;
    text-align: center;
    letter-spacing: 1px;
  }

  .role-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .role-card {
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    background: var(--white);
    position: relative;
  }

  .role-card:hover {
    border-color: var(--sage-light);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }

  .role-card:active { transform: scale(0.96); }

  .role-card .role-icon {
    width: 34px; height: 34px;
    margin: 0 auto 8px;
    border-radius: 50%;
    background: var(--sage-bg);
    color: var(--sage);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 700;
    transition: all 0.25s ease;
  }

  .role-card .name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 2px;
  }

  .role-card .desc {
    font-size: 11px;
    color: var(--text-light);
    font-weight: 400;
  }

  .role-card.active {
    border-color: var(--sage);
    background: var(--sage-bg);
    box-shadow: var(--shadow-sm);
  }

  .role-card.active .role-icon {
    background: var(--sage);
    color: var(--white);
  }

  .role-card.active .name { color: var(--sage-dark); }

  /* ===== Form ===== */
  .form-section { padding: 8px 32px 32px; }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .form-input {
    width: 100%;
    padding: 14px 16px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    color: var(--text-main);
    background: var(--white);
    transition: all 0.2s ease;
    -webkit-appearance: none;
  }

  .form-input::placeholder { color: var(--text-placeholder); }

  .form-input:focus {
    outline: none;
    border-color: var(--sage);
    box-shadow: 0 0 0 3px rgba(74, 107, 90, 0.08);
  }

  .login-btn {
    width: 100%;
    padding: 15px;
    background: var(--sage);
    color: var(--white);
    border: none;
    border-radius: var(--radius-full);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-top: 4px;
    box-shadow: 0 4px 14px rgba(74, 107, 90, 0.2);
    letter-spacing: 1px;
  }

  .login-btn:hover {
    background: var(--sage-dark);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(74, 107, 90, 0.28);
  }

  .login-btn:active {
    transform: translateY(0);
  }

  .login-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* Hint */
  .hint {
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--warm-bg);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.7;
    text-align: center;
    border: 0.5px solid var(--border-light);
  }

  .hint b { color: var(--sage-dark); font-weight: 600; }

  /* Footer brand */
  .login-footer {
    text-align: center;
    margin-top: 20px;
    padding-bottom: 8px;
  }
  .login-footer .brand-tag {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 1px;
  }
  .login-footer .brand-sub {
    font-size: 11px;
    color: var(--text-light);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 28px; left: 50%;
    transform: translateX(-50%);
    background: rgba(42, 58, 48, 0.92);
    color: var(--white);
    padding: 12px 28px;
    border-radius: var(--radius-full);
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
  }

  .toast.show { opacity: 1; }

  .hidden { display: none !important; }

  @media (max-width: 420px) {
    .login-card { border-radius: var(--radius-lg); }
    .login-header { padding: 36px 24px 40px; }
    .role-section, .form-section { padding-left: 22px; padding-right: 22px; }
    .role-cards { gap: 8px; }
    .role-card { padding: 14px 6px; }
    .role-card .name { font-size: 13px; }
    .login-header h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <div class="logo-ring">
        <div class="logo-box">
          <img src="/images/logo-light.png" alt="立和设计">
        </div>
      </div>
      <h1>立和设计</h1>
      <div class="slogan">Design for Time</div>
      <div class="gold-divider"></div>
      <!-- Wave bottom -->
      <div class="wave-bottom">
        <svg viewBox="0 0 440 20" preserveAspectRatio="none">
          <path d="M0,10 Q110,2 220,10 T440,10 L440,20 L0,20 Z" fill="#FFFFFF"/>
        </svg>
      </div>
    </div>

    <!-- Role Selection -->
    <div class="role-section">
      <div class="label">选择您的身份</div>
      <div class="role-cards">
        <div class="role-card active" data-role="client" onclick="selectRole('client')">
          <div class="role-icon">客</div>
          <div class="name">客户</div>
          <div class="desc">查看进度</div>
        </div>
        <div class="role-card" data-role="staff" onclick="selectRole('staff')">
          <div class="role-icon">员</div>
          <div class="name">员工</div>
          <div class="desc">项目管理</div>
        </div>
        <div class="role-card" data-role="boss" onclick="selectRole('boss')">
          <div class="role-icon">管</div>
          <div class="name">管理</div>
          <div class="desc">数据后台</div>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="form-section">
      <!-- Client Form -->
      <div id="clientForm">
        <div class="form-group">
          <label>手机号</label>
          <input class="form-input" id="phoneInput" type="tel" placeholder="请输入登记手机号" maxlength="11">
        </div>
        <button class="login-btn" id="clientLoginBtn" onclick="doLogin()">查看我的项目</button>
        <div class="hint">输入您在立和登记的手机号，即可查看所有项目进度与确认节点</div>
      </div>

      <!-- Staff Form -->
      <div id="staffForm" class="hidden">
        <div class="form-group">
          <label>工号</label>
          <input class="form-input" id="staffIdInput" type="text" placeholder="请输入工号">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-input" id="staffPwdInput" type="password" placeholder="请输入密码">
        </div>
        <button class="login-btn" id="staffLoginBtn" onclick="doLogin()">登 录</button>
      </div>

      <!-- Boss Form -->
      <div id="bossForm" class="hidden">
        <div class="form-group">
          <label>管理员账号</label>
          <input class="form-input" id="bossIdInput" type="text" placeholder="请输入管理员账号">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-input" id="bossPwdInput" type="password" placeholder="请输入密码">
        </div>
        <button class="login-btn" id="bossLoginBtn" onclick="doLogin()">登 录</button>
      </div>
    </div>
  </div>

  <div class="login-footer">
    <div class="brand-tag">为时间而设计</div>
    <div class="brand-sub">LIHE DESIGN · 立和室内设计</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = new URLSearchParams(window.location.search).get('api')
    || (window.location.hostname === 'localhost'
        ? 'http://localhost:3000'
        : window.location.origin);

  let currentRole = 'client';

  // ===== Role Selection =====
  function selectRole(role) {
    currentRole = role;
    document.querySelectorAll('.role-card').forEach(c => {
      c.classList.toggle('active', c.dataset.role === role);
    });
    document.getElementById('clientForm').classList.toggle('hidden', role !== 'client');
    document.getElementById('staffForm').classList.toggle('hidden', role !== 'staff');
    document.getElementById('bossForm').classList.toggle('hidden', role !== 'boss');
  }

  // ===== Login =====
  async function doLogin() {
    const activeFormId = ['clientForm', 'staffForm', 'bossForm'].find(id => !document.getElementById(id).classList.contains('hidden'));
    const activeBtn = activeFormId ? document.getElementById(activeFormId).querySelector('button') : null;
    const origText = activeBtn ? activeBtn.textContent : '';

    if (activeBtn) { activeBtn.disabled = true; activeBtn.textContent = '验证中...'; }

    try {
      if (currentRole === 'client') {
        await loginClient();
      } else if (currentRole === 'staff') {
        await loginStaff();
      } else if (currentRole === 'boss') {
        await loginBoss();
      }
    } catch (err) {
      showToast(err.message || '登录失败');
    } finally {
      if (activeBtn) { activeBtn.disabled = false; activeBtn.textContent = origText; }
    }
  }

  // ===== Client Login =====
  async function loginClient() {
    const phone = document.getElementById('phoneInput').value.trim();
    if (!phone || phone.length < 11) {
      showToast('请输入正确的手机号');
      return;
    }

    const resp = await fetch(`${API_BASE}/api/project?phone=${encodeURIComponent(phone)}`);
    const data = await resp.json();
    if (data.success) {
      localStorage.setItem('lihe_role', 'client');
      localStorage.setItem('lihe_phone', phone);
      window.location.href = '/client.html?autologin=1';
    } else {
      throw new Error(data.message || '未找到关联项目');
    }
  }

  // ===== Staff Login =====
  async function loginStaff() {
    const staffId = document.getElementById('staffIdInput').value.trim().toUpperCase();
    const password = document.getElementById('staffPwdInput').value.trim();
    if (!staffId || !password) {
      showToast('请输入工号和密码');
      return;
    }

    const resp = await fetch(`${API_BASE}/api/project?staffId=${staffId}&password=${encodeURIComponent(password)}`);
    if (!resp.ok) {
      let errMsg = '工号或密码错误';
      try { const e = await resp.json(); if (e.error) errMsg = e.error; } catch(_) {}
      throw new Error(errMsg);
    }
    const data = await resp.json();
    if (data.success) {
      localStorage.setItem('lihe_role', 'staff');
      localStorage.setItem('lihe_staffId', staffId);
      localStorage.setItem('lihe_password', password);
      localStorage.setItem('lihe_staffName', data.staffName || '');
      localStorage.setItem('lihe_staffRole', data.staffRole || '');
      window.location.href = '/staff.html?autologin=1';
    } else {
      throw new Error(data.error || '登录失败');
    }
  }

  // ===== Boss Login =====
  async function loginBoss() {
    const bossId = document.getElementById('bossIdInput').value.trim();
    const password = document.getElementById('bossPwdInput').value.trim();
    if (!bossId || !password) {
      showToast('请输入账号和密码');
      return;
    }

    const resp = await fetch(`${API_BASE}/api/boss?staffId=${encodeURIComponent(bossId)}&password=${encodeURIComponent(password)}`);
    const data = await resp.json();
    if (data.success) {
      localStorage.setItem('lihe_role', 'boss');
      localStorage.setItem('lihe_staffId', bossId);
      localStorage.setItem('lihe_password', password);
      window.location.href = '/boss.html?autologin=1';
    } else {
      throw new Error(data.error || '账号或密码错误');
    }
  }

  // ===== Toast =====
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ===== Enter key =====
  document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') doLogin();
  });

  // ===== Clear old account IDs from previous system =====
  const oldIds = ['D01', 'D02', 'P01', 'P02', 'A01', 'A02'];
  const savedStaffId = localStorage.getItem('lihe_staffId');
  if (savedStaffId && oldIds.includes(savedStaffId.toUpperCase())) {
    localStorage.removeItem('lihe_role');
    localStorage.removeItem('lihe_staffId');
    localStorage.removeItem('lihe_password');
    localStorage.removeItem('lihe_staffName');
    localStorage.removeItem('lihe_staffRole');
  }

  // ===== Auto-redirect if already logged in (with valid credentials) =====
  const savedRole = localStorage.getItem('lihe_role');
  if (savedRole === 'client' && localStorage.getItem('lihe_phone')) {
    window.location.href = '/client.html?autologin=1';
  } else if (savedRole === 'staff' && localStorage.getItem('lihe_staffId') && localStorage.getItem('lihe_password')) {
    window.location.href = '/staff.html?autologin=1';
  } else if (savedRole === 'boss' && localStorage.getItem('lihe_staffId') && localStorage.getItem('lihe_password')) {
    window.location.href = '/boss.html?autologin=1';
  }
</script>
</body>
</html>
