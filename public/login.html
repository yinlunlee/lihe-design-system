<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立和设计 · 统一登录</title>
<style>
  :root {
    --forest: #3D6B4A;
    --forest-dark: #2D5440;
    --forest-light: #5A8E6A;
    --leaf: #7DB38A;
    --mist: #E8F3EB;
    --cream: #F7FBF8;
    --card: #FFFFFF;
    --text: #1E3829;
    --text-secondary: #557A63;
    --text-light: #8AA898;
    --border: #D8E8DD;
    --danger: #D95A5A;
    --shadow: 0 20px 60px rgba(30, 80, 50, 0.18);
    --shadow-soft: 0 4px 16px rgba(30, 80, 50, 0.08);
    --radius-xl: 28px;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, var(--forest-dark) 0%, var(--forest) 45%, var(--forest-light) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-container {
    background: var(--card);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
  }

  /* Header */
  .login-header {
    background: linear-gradient(135deg, var(--forest-dark), var(--forest));
    padding: 44px 32px 36px;
    text-align: center;
    color: #fff;
    position: relative;
  }
  .login-header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 32px;
    background: var(--card);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  }
  .logo-box {
    width: 110px; height: 110px;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(10px);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }
  .logo-box img {
    width: 72%;
    height: 72%;
    object-fit: contain;
    filter: brightness(0) invert(1);
  }
  .login-header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; position: relative; z-index: 1; }
  .login-header p { font-size: 13px; opacity: 0.82; margin-top: 6px; position: relative; z-index: 1; }

  /* Role Selection */
  .role-section { padding: 24px 32px 16px; }
  .role-section .label {
    font-size: 14px; font-weight: 600; color: var(--text-secondary);
    margin-bottom: 16px; text-align: center;
  }
  .role-cards {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .role-card {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    background: var(--cream);
  }
  .role-card:active { transform: scale(0.96); }
  .role-card .name { font-size: 15px; font-weight: 700; color: var(--text); }
  .role-card .desc { font-size: 11px; color: var(--text-light); margin-top: 4px; font-weight: 500; }
  .role-card.active {
    border-color: var(--forest);
    background: var(--mist);
    box-shadow: var(--shadow-soft);
  }
  .role-card.active .name { color: var(--forest-dark); }

  /* Form */
  .form-section { padding: 8px 32px 32px; }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .form-input {
    width: 100%;
    padding: 15px 18px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    color: var(--text);
    background: var(--cream);
    transition: all 0.2s ease;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--forest);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(61, 107, 74, 0.08);
  }
  .login-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--forest) 0%, var(--forest-light) 100%);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 6px;
    box-shadow: 0 6px 18px rgba(61, 107, 74, 0.25);
  }
  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(61, 107, 74, 0.32); }
  .login-btn:active { transform: translateY(0); background: var(--forest-dark); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

  /* Hint */
  .hint {
    margin-top: 18px;
    padding: 14px 16px;
    background: var(--mist);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.7;
    text-align: center;
  }
  .hint b { color: var(--forest-dark); }

  /* Toast */
  .toast {
    position: fixed;
    top: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(30, 56, 41, 0.92);
    color: #fff;
    padding: 12px 28px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  .toast.show { opacity: 1; }

  /* Hidden by default */
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="login-container">
  <!-- Header -->
  <div class="login-header">
    <div class="logo-box">
      <img src="/images/logo.png" alt="立和设计">
    </div>
    <h1>项目协同平台</h1>
    <p>客户 · 员工 · 管理 一站式入口</p>
  </div>

  <!-- Role Selection -->
  <div class="role-section">
    <div class="label">请选择您的身份</div>
    <div class="role-cards">
      <div class="role-card active" data-role="client" onclick="selectRole('client')">
        <div class="name">客户</div>
        <div class="desc">查看项目进度</div>
      </div>
      <div class="role-card" data-role="staff" onclick="selectRole('staff')">
        <div class="name">员工</div>
        <div class="desc">项目上传管理</div>
      </div>
      <div class="role-card" data-role="boss" onclick="selectRole('boss')">
        <div class="name">管理</div>
        <div class="desc">全局数据后台</div>
      </div>
    </div>
  </div>

  <!-- Form -->
  <div class="form-section">
    <!-- Client Form -->
    <div id="clientForm">
      <div class="form-group">
        <label>手机号</label>
        <input class="form-input" id="phoneInput" type="tel" placeholder="请输入您的手机号" maxlength="11">
      </div>
      <button class="login-btn" id="clientLoginBtn" onclick="doLogin()">查看我的项目</button>
      <div class="hint">📱 输入您在立和登记的手机号，即可查看所有项目进度和确认节点</div>
    </div>

    <!-- Staff Form -->
    <div id="staffForm" class="hidden">
      <div class="form-group">
        <label>工号</label>
        <input class="form-input" id="staffIdInput" type="text" placeholder="请输入工号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="form-input" id="staffPwdInput" type="password" placeholder="请输入密码">
      </div>
      <button class="login-btn" id="staffLoginBtn" onclick="doLogin()">登 录</button>
    </div>

    <!-- Boss Form -->
    <div id="bossForm" class="hidden">
      <div class="form-group">
        <label>管理员账号</label>
        <input class="form-input" id="bossIdInput" type="text" placeholder="请输入管理员账号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="form-input" id="bossPwdInput" type="password" placeholder="请输入密码">
      </div>
      <button class="login-btn" id="bossLoginBtn" onclick="doLogin()">登 录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = new URLSearchParams(window.location.search).get('api')
    || (window.location.hostname === 'localhost'
        ? 'http://localhost:3000'
        : window.location.origin);

  let currentRole = 'client';

  // ===== Role Selection =====
  function selectRole(role) {
    currentRole = role;
    document.querySelectorAll('.role-card').forEach(c => {
      c.classList.toggle('active', c.dataset.role === role);
    });
    document.getElementById('clientForm').classList.toggle('hidden', role !== 'client');
    document.getElementById('staffForm').classList.toggle('hidden', role !== 'staff');
    document.getElementById('bossForm').classList.toggle('hidden', role !== 'boss');
  }

  // ===== Login =====
  async function doLogin() {
    const activeFormId = ['clientForm', 'staffForm', 'bossForm'].find(id => !document.getElementById(id).classList.contains('hidden'));
    const activeBtn = activeFormId ? document.getElementById(activeFormId).querySelector('button') : null;
    const origText = activeBtn ? activeBtn.textContent : '';

    if (activeBtn) { activeBtn.disabled = true; activeBtn.textContent = '验证中...'; }

    try {
      if (currentRole === 'client') {
        await loginClient();
      } else if (currentRole === 'staff') {
        await loginStaff();
      } else if (currentRole === 'boss') {
        await loginBoss();
      }
    } catch (err) {
      showToast(err.message || '登录失败');
    } finally {
      if (activeBtn) { activeBtn.disabled = false; activeBtn.textContent = origText; }
    }
  }

  // ===== Client Login =====
  async function loginClient() {
    const phone = document.getElementById('phoneInput').value.trim();
    if (!phone || phone.length < 11) {
      showToast('请输入正确的手机号');
      return;
    }

    const resp = await fetch(`${API_BASE}/api/project?phone=${encodeURIComponent(phone)}`);
    const data = await resp.json();
    if (data.success) {
      localStorage.setItem('lihe_role', 'client');
      localStorage.setItem('lihe_phone', phone);
      window.location.href = '/client.html?autologin=1';
    } else {
      throw new Error(data.message || '未找到关联项目');
    }
  }

  // ===== Staff Login =====
  async function loginStaff() {
    const staffId = document.getElementById('staffIdInput').value.trim().toUpperCase();
    const password = document.getElementById('staffPwdInput').value.trim();
    if (!staffId || !password) {
      showToast('请输入工号和密码');
      return;
    }

    const resp = await fetch(`${API_BASE}/api/project?staffId=${staffId}&password=${encodeURIComponent(password)}`);
    if (!resp.ok) {
      let errMsg = '工号或密码错误';
      try { const e = await resp.json(); if (e.error) errMsg = e.error; } catch(_) {}
      throw new Error(errMsg);
    }
    const data = await resp.json();
    if (data.success) {
      localStorage.setItem('lihe_role', 'staff');
      localStorage.setItem('lihe_staffId', staffId);
      localStorage.setItem('lihe_password', password);
      localStorage.setItem('lihe_staffName', data.staffName || '');
      localStorage.setItem('lihe_staffRole', data.staffRole || '');
      window.location.href = '/staff.html?autologin=1';
    } else {
      throw new Error(data.error || '登录失败');
    }
  }

  // ===== Boss Login =====
  async function loginBoss() {
    const bossId = document.getElementById('bossIdInput').value.trim();
    const password = document.getElementById('bossPwdInput').value.trim();
    if (!bossId || !password) {
      showToast('请输入账号和密码');
      return;
    }

    const resp = await fetch(`${API_BASE}/api/boss?staffId=${encodeURIComponent(bossId)}&password=${encodeURIComponent(password)}`);
    const data = await resp.json();
    if (data.success) {
      localStorage.setItem('lihe_role', 'boss');
      localStorage.setItem('lihe_staffId', bossId);
      localStorage.setItem('lihe_password', password);
      window.location.href = '/boss.html?autologin=1';
    } else {
      throw new Error(data.error || '账号或密码错误');
    }
  }

  // ===== Toast =====
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ===== Enter key =====
  document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') doLogin();
  });

  // ===== Clear old account IDs from previous system =====
  const oldIds = ['D01', 'D02', 'P01', 'P02', 'A01', 'A02'];
  const savedStaffId = localStorage.getItem('lihe_staffId');
  if (savedStaffId && oldIds.includes(savedStaffId.toUpperCase())) {
    // Old credentials - clear everything to force fresh login
    localStorage.removeItem('lihe_role');
    localStorage.removeItem('lihe_staffId');
    localStorage.removeItem('lihe_password');
    localStorage.removeItem('lihe_staffName');
    localStorage.removeItem('lihe_staffRole');
  }

  // ===== Auto-redirect if already logged in (with valid credentials) =====
  const savedRole = localStorage.getItem('lihe_role');
  if (savedRole === 'client' && localStorage.getItem('lihe_phone')) {
    window.location.href = '/client.html?autologin=1';
  } else if (savedRole === 'staff' && localStorage.getItem('lihe_staffId') && localStorage.getItem('lihe_password')) {
    window.location.href = '/staff.html?autologin=1';
  } else if (savedRole === 'boss' && localStorage.getItem('lihe_staffId') && localStorage.getItem('lihe_password')) {
    window.location.href = '/boss.html?autologin=1';
  }
</script>
</body>
</html>
