<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>立和设计 · 我的项目</title>
<style>
  :root {
    /* Premium Green Palette */
    --sage: #2A6B50;
    --sage-light: #3A8A68;
    --sage-dark: #153D2C;
    --sage-bg: #F0F7F2;
    --sage-border: #D8E8DE;
    --text-main: #0A241B;
    --text-secondary: #3D5A4D;
    --text-light: #6E8B7D;
    --bg: #FAFCFA;
    --white: #FFFFFF;
    --accent: #B8956B;
    --gold-pale: #F0E6D6;
    --success: #2A6B50;
    --warning: #C98B4F;
    --danger: #C75B5B;
    --radius: 12px;
    --radius-lg: 20px;
    --shadow: 0 4px 18px rgba(10, 36, 27, 0.07);
    --shadow-hover: 0 10px 32px rgba(10, 36, 27, 0.11);
    --shadow-glow: 0 0 0 4px rgba(42, 107, 80, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text-main);
    line-height: 1.6;
    font-size: 15px;
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* 顶部装饰条 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 500px; height: 168px;
    background: linear-gradient(160deg, var(--sage-dark) 0%, var(--sage) 55%, var(--sage-light) 100%);
    border-radius: 0 0 32px 32px;
    z-index: -1;
    box-shadow: 0 8px 24px rgba(10, 36, 27, 0.14);
  }

  /* ===== 登录页 ===== */
  .login-page { padding: 80px 28px 40px; text-align: center; }
  .login-logo {
    width: 90px; height: 90px;
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(10px);
    border: 1.5px solid rgba(255,255,255,0.28);
    border-radius: 50%;
    margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }
  .login-logo img { width: 70%; height: 70%; object-fit: contain; }
  .login-title { font-size: 22px; font-weight: 700; color: var(--white); margin-bottom: 4px; text-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  .login-subtitle { font-size: 13px; color: rgba(255,255,255,0.82); margin-bottom: 36px; }
  .login-input {
    width: 100%;
    padding: 15px 18px;
    border: 1.5px solid var(--sage-border);
    border-radius: var(--radius);
    font-size: 16px;
    margin-bottom: 14px;
    background: var(--white);
    -webkit-appearance: none;
    transition: all 0.2s ease;
  }
  .login-input:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 4px rgba(42, 107, 80, 0.08); }
  .login-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--sage) 0%, var(--sage-light) 100%);
    color: var(--white);
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s ease;
    box-shadow: 0 6px 18px rgba(21, 61, 44, 0.24);
  }
  .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(21, 61, 44, 0.3); }
  .login-btn:active { background: var(--sage-dark); transform: translateY(0); }
  .login-btn:disabled { opacity: 0.6; transform: none; box-shadow: none; }

  /* ===== 顶部导航 ===== */
  .nav-bar {
    background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 55%, var(--sage-light) 100%);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    color: var(--white);
    border-radius: 0 0 24px 24px;
    box-shadow: 0 6px 20px rgba(10, 36, 27, 0.14);
  }
  .nav-brand { display: flex; align-items: center; gap: 8px; }
  .nav-logo {
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--white); font-size: 12px; font-weight: 700;
    overflow: hidden;
  }
  .nav-logo img { width: 80%; height: 80%; object-fit: contain; }
  .nav-title { font-size: 16px; font-weight: 700; color: var(--white); }
  .nav-logout { font-size: 13px; color: rgba(255,255,255,0.85); cursor: pointer; font-weight: 500; }

  /* ===== 项目卡片 ===== */
  .project-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin: 12px 16px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(212, 228, 216, 0.5);
  }
  .project-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .project-name { font-size: 17px; font-weight: 700; color: var(--text-main); }
  .project-code { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .stage-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .stage-badge.active { background: var(--sage-bg); color: var(--sage-dark); }
  .stage-badge.done { background: var(--sage-bg); color: var(--sage-dark); }
  .stage-badge.pending { background: var(--gold-pale); color: #6B4E2E; }
  .stage-badge.alert { background: #FCE8E8; color: #8B3A3A; }

  /* 进度条 */
  .progress-bar-bg {
    width: 100%; height: 6px;
    background: var(--sage-bg);
    border-radius: 3px;
    margin: 8px 0 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sage), var(--sage-light));
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .progress-text { font-size: 12px; color: var(--text-light); display: flex; justify-content: space-between; }

  .project-meta {
    display: flex; flex-wrap: wrap; gap: 4px 16px;
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .project-meta-item { display: flex; align-items: center; gap: 4px; }

  /* ===== 时间线 ===== */
  .timeline { padding: 8px 16px 24px; }
  .timeline-phase {
    font-size: 13px; font-weight: 600;
    color: var(--sage-dark);
    margin: 16px 0 8px;
    padding-left: 8px;
    border-left: 3px solid var(--sage);
  }
  .timeline-item {
    position: relative;
    padding: 0 0 16px 24px;
    margin-left: 8px;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: 0; top: 4px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--sage-border);
    border: 2px solid var(--white);
    z-index: 1;
  }
  .timeline-item.done::before { background: var(--sage); }
  .timeline-item.pending::before { background: var(--accent); }
  .timeline-item.revise::before { background: var(--danger); }
  .timeline-item:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 4px; top: 14px;
    width: 2px; height: calc(100% - 10px);
    background: var(--sage-border);
  }

  .node-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .node-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .node-name { font-size: 15px; font-weight: 600; color: var(--text-main); }
  .node-status {
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .node-status.wait { background: var(--sage-bg); color: var(--sage-dark); }
  .node-status.confirmed { background: var(--sage-bg); color: var(--sage-dark); }
  .node-status.revising { background: #FCE8E8; color: #8B3A3A; }

  .node-desc { font-size: 13px; color: var(--text-secondary); margin: 4px 0 8px; }
  .node-time { font-size: 12px; color: var(--text-light); }
  .node-uploader { font-size: 12px; color: var(--text-light); margin-top: 2px; }

  /* 附件预览 */
  .attachment-grid {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin: 8px 0;
  }
  .attachment-thumb {
    width: calc(33.333% - 4px);
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    background: var(--sage-bg);
    position: relative;
    cursor: pointer;
  }
  .attachment-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    background: linear-gradient(110deg, var(--sage-bg) 30%, rgba(255,255,255,0.4) 50%, var(--sage-bg) 70%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
  }
  .attachment-thumb img.loaded {
    animation: none;
    background: none;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .attachment-thumb.file {
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--sage);
  }
  .attachment-more {
    position: absolute; bottom: 0; right: 0;
    background: rgba(0,0,0,0.5);
    color: var(--white);
    font-size: 14px; font-weight: 600;
    padding: 2px 8px;
    border-radius: 8px 0 0 0;
  }

  /* 确认按钮 */
  .node-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-confirm {
    flex: 1;
    padding: 11px;
    background: linear-gradient(135deg, var(--sage) 0%, var(--sage-light) 100%);
    color: var(--white);
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(21, 61, 44, 0.18);
    transition: all 0.2s ease;
  }
  .btn-confirm:hover { transform: translateY(-1px); }
  .btn-confirm:active { background: var(--sage-dark); transform: translateY(0); }
  .btn-confirm:disabled { opacity: 0.5; transform: none; box-shadow: none; }
  .btn-revise {
    flex: 1;
    padding: 11px;
    background: var(--white);
    color: var(--sage-dark);
    border: 1.5px solid var(--sage-border);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-revise:active { background: var(--sage-bg); }

  /* 修改意见输入 */
  .revise-box { display: none; margin-top: 10px; }
  .revise-box.show { display: block; }
  .revise-textarea {
    width: 100%;
    min-height: 80px;
    padding: 10px;
    border: 1.5px solid var(--sage-border);
    border-radius: 8px;
    font-size: 14px;
    resize: none;
    -webkit-appearance: none;
  }
  .revise-textarea:focus { outline: none; border-color: var(--sage); }
  .revise-submit {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: var(--white);
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 8px;
    cursor: pointer;
  }

  /* ===== 图片查看器 ===== */
  .image-viewer {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .image-viewer.show { display: flex; }
  .image-viewer img { max-width: 95%; max-height: 90vh; border-radius: 4px; }
  .image-viewer .viewer-spinner {
    position: absolute; width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .image-viewer img.loaded ~ .viewer-spinner { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .viewer-close {
    position: absolute; top: 16px; right: 16px;
    color: var(--white); font-size: 28px;
    cursor: pointer; z-index: 10000;
  }

  /* ===== 空状态 ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }
  .empty-icon {
    width: 72px; height: 72px;
    background: var(--sage-bg);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 13px; font-weight: 700; color: var(--sage);
    letter-spacing: 0.5px;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 36, 27, 0.94);
    color: var(--white);
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 10001;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ===== 底部 ===== */
  .footer {
    text-align: center;
    padding: 20px;
    color: var(--text-light);
    font-size: 12px;
  }
  .footer-divider {
    width: 40px; height: 2px;
    background: var(--sage);
    margin: 0 auto 10px;
    border-radius: 1px;
  }

  .loading { text-align: center; padding: 40px; color: var(--text-light); }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--sage-bg);
    border-top: 3px solid var(--sage);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div id="loginPage" class="login-page">
  <div class="login-logo"><img src="/images/logo-light.png" alt="立和设计"></div>
  <div class="login-title">我的项目</div>
  <div class="login-subtitle">查看进度 · 确认节点</div>
  <input class="login-input" id="phoneInput" type="tel" placeholder="请输入您的手机号" maxlength="11">
  <button class="login-btn" id="loginBtn" onclick="doLogin()">查 看 我 的 项 目</button>
  <div style="margin-top:24px; font-size:12px; color:var(--text-light);">
    手机号需与您在立和登记的联系方式一致
  </div>
</div>

<!-- ===== 主页面 ===== -->
<div id="mainPage" style="display:none;">
  <!-- 导航栏 -->
  <div class="nav-bar">
    <div class="nav-brand">
      <div class="nav-logo"><img src="/images/logo-light.png" alt="立和设计"></div>
      <div class="nav-title">我的项目</div>
    </div>
    <div class="nav-logout" onclick="logout()">切换账号</div>
  </div>

  <!-- 项目列表+时间线 -->
  <div id="contentArea"></div>

  <!-- 底部 -->
  <div class="footer">
    <div class="footer-divider"></div>
    <p>立和质作  |  为时间而设计  ·  Design for Time</p>
  </div>
</div>

<!-- 图片查看器 -->
<div class="image-viewer" id="imageViewer" onclick="closeViewer()">
  <span class="viewer-close">&times;</span>
  <img id="viewerImg" src="" onload="this.classList.add('loaded')">
  <div class="viewer-spinner" id="viewerSpinner"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ===== API 基础地址 =====
  // 支持 ?api= 参数或 localStorage 配置
  const API_BASE = new URLSearchParams(window.location.search).get('api')
    || localStorage.getItem('lihe_api_base')
    || (window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1')
      ? 'http://localhost:3000'
      : window.location.origin);

  // ===== 登录 =====
  function doLogin() {
    const phone = document.getElementById('phoneInput').value.trim();
    if (!phone || phone.length < 11) {
      showToast('请输入正确的手机号');
      return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = '查询中...';

    // 查询项目
    fetch(`${API_BASE}/api/project?phone=${encodeURIComponent(phone)}`)
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          localStorage.setItem('lihe_phone', phone);
          showMainPage(phone, data.projects);
        } else {
          showToast(data.message || '查询失败');
        }
      })
      .catch(err => {
        // 演示模式：如果API未部署，用模拟数据展示
        console.warn('API未连接，使用演示模式:', err);
        showDemoPage(phone);
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = '查 看 我 的 项 目';
      });
  }

  // ===== 显示主页面 =====
  function showMainPage(phone, projects) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';

    const area = document.getElementById('contentArea');

    if (projects.length === 0) {
      area.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">暂无</div>
          <p>暂无关联项目</p>
          <p style="font-size:13px; margin-top:4px;">请联系您的专属顾问为您绑定项目</p>
        </div>
      `;
      return;
    }

    // 先渲染项目卡片，再加载节点
    let html = '';
    projects.forEach((p, i) => {
      html += renderProjectCard(p);
    });
    area.innerHTML = html;

    // 为每个项目加载节点
    projects.forEach(p => {
      loadNodes(p);
    });
  }

  // ===== 渲染项目卡片 =====
  function renderProjectCard(p) {
    const statusBadge = getStatusBadge(p);
    return `
      <div class="project-card" id="proj-${p.recordId}">
        <div class="project-header">
          <div>
            <div class="project-name">${p.name}</div>
            <div class="project-code">${p.code}</div>
          </div>
          <div class="stage-badge ${statusBadge.cls}">${p.stage || '待启动'}</div>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${p.progress}%"></div>
        </div>
        <div class="progress-text">
          <span>进度</span>
          <span>${p.progress}%</span>
        </div>
        <div class="project-meta">
          ${p.spaceType ? `<div class="project-meta-item"><span style="color:var(--sage);font-weight:600;">空间</span> ${p.spaceType}</div>` : ''}
          ${p.area ? `<div class="project-meta-item"><span style="color:var(--sage);font-weight:600;">面积</span> ${p.area}㎡</div>` : ''}
          ${p.address ? `<div class="project-meta-item"><span style="color:var(--sage);font-weight:600;">地址</span> ${p.address}</div>` : ''}
          ${p.designerName ? `<div class="project-meta-item"><span style="color:var(--sage);font-weight:600;">设计</span> ${p.designerName}</div>` : ''}
          ${p.softDecoName ? `<div class="project-meta-item"><span style="color:var(--sage);font-weight:600;">软装</span> ${p.softDecoName}</div>` : ''}
          ${p.drawingName ? `<div class="project-meta-item"><span style="color:var(--sage);font-weight:600;">施工图</span> ${p.drawingName}</div>` : ''}
          ${p.supervisorName ? `<div class="project-meta-item"><span style="color:var(--sage);font-weight:600;">监理</span> ${p.supervisorName}</div>` : ''}
        </div>
      </div>
      <div class="timeline" id="nodes-${p.recordId}">
        <div class="loading"><div class="spinner"></div>加载节点...</div>
      </div>
    `;
  }

  function getStatusBadge(p) {
    if (p.status === '正常') return { cls: 'active' };
    if (p.status && p.status.includes('停工')) return { cls: 'alert' };
    return { cls: 'active' };
  }

  // ===== 加载节点 =====
  function loadNodes(project) {
    const container = document.getElementById(`nodes-${project.recordId}`);

    fetch(`${API_BASE}/api/nodes?phone=${encodeURIComponent(localStorage.getItem('lihe_phone'))}`)
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          const nodes = data.nodes.filter(n => n.projectId === project.recordId);
          renderNodes(container, nodes, project);
        }
      })
      .catch(err => {
        container.innerHTML = '';
      });
  }

  // ===== 渲染节点时间线 =====
  function renderNodes(container, nodes, project) {
    if (nodes.length === 0) {
      container.innerHTML = `
        <div style="text-align:center; padding:20px; color:var(--text-light); font-size:13px;">
          暂无节点记录，等待设计团队上传成果
        </div>
      `;
      return;
    }

    // 按 phase 分组
    const phases = { '洽谈': [], '设计': [], '施工': [], '软装': [], '竣工': [] };
    nodes.forEach(n => {
      const phase = getPhaseByStage(n.stage);
      if (phases[phase]) phases[phase].push(n);
    });

    let html = '';
    Object.entries(phases).forEach(([phase, phaseNodes]) => {
      if (phaseNodes.length === 0) return;
      html += `<div class="timeline-phase">${phase}</div>`;
      phaseNodes.forEach(node => {
        html += renderNode(node);
      });
    });

    container.innerHTML = html;
  }

  function getPhaseByStage(stage) {
    const map = {
      '需求解析': '洽谈',
      // 设计阶段
      '平面布局方案': '设计', '效果图设计': '设计', '物料整理': '设计',
      '施工图设计': '设计', '报价签合同': '设计',
      '概念方案': '设计', '深化方案': '设计', '施工图': '设计',
      // 施工阶段
      '开工前期准备': '施工', '拆除改造': '施工', '水电隐蔽工程': '施工',
      '防水工程': '施工', '泥瓦工程': '施工', '木工吊顶': '施工',
      '油漆墙面': '施工', '安装阶段': '施工', '开荒保洁竣工验收': '施工',
      '施工-拆除水电': '施工', '施工-泥木': '施工', '施工-油漆安装': '施工',
      // 软装阶段
      '软装-前期对接': '软装', '软装-方案设计': '软装', '软装-深化定品': '软装',
      '软装-采购跟单': '软装', '软装-进场摆场': '软装', '软装-售后质保': '软装',
      '软装方案': '软装', '软装落地': '软装',
      // 竣工
      '竣工交付': '竣工', '竣工验收': '竣工',
    };
    return map[stage] || '设计';
  }

  // ===== 渲染单个节点 =====
  function renderNode(node) {
    const statusCls = node.status === '已确认' ? 'done' : (node.status === '有修改意见' ? 'revise' : 'pending');
    const statusBadge = node.status === '已确认' ? 'confirmed' : (node.status === '有修改意见' ? 'revising' : 'wait');
    const isPending = node.status === '待确认' || !node.status;

    // 附件预览（仅在线浏览，不可下载）
    let attachHtml = '';
    if (node.attachments && node.attachments.length > 0) {
      attachHtml = '<div class="attachment-grid">';
      node.attachments.slice(0, 6).forEach((att, i) => {
        const fullUrl = `${API_BASE}${att.url}`;
        const isImage = att.type && att.type.startsWith('image/');
        const isVideo = att.type && att.type.startsWith('video/');
        const fileIcon = getAttachmentIcon(att.name, att.type);
        if (isImage && att.url) {
          attachHtml += `<div class="attachment-thumb" onclick="viewImage('${fullUrl}')"><img src="${fullUrl}" alt="${att.name}" loading="lazy" onload="this.classList.add('loaded')"></div>`;
        } else if (isVideo && att.url) {
          attachHtml += `<div class="attachment-thumb file" onclick="previewFile('${fullUrl}')" style="flex-direction:column;padding:4px;"><span style="font-size:11px;font-weight:700;color:var(--sage);">VIDEO</span><span style="font-size:9px;margin-top:2px;color:var(--text-light);">视频</span></div>`;
        } else {
          attachHtml += `<div class="attachment-thumb file" onclick="previewFile('${fullUrl}')" style="flex-direction:column;padding:4px;">${fileIcon.icon}<span style="font-size:9px;margin-top:2px;color:var(--text-light);">${fileIcon.label}</span></div>`;
        }
      });
      if (node.attachments.length > 6) {
        attachHtml += `<div class="attachment-thumb file" style="position:relative;"><span style="font-size:11px;font-weight:700;color:var(--sage);">更多</span><span class="attachment-more">+${node.attachments.length - 6}</span></div>`;
      }
      attachHtml += '</div>';
    }

    // 确认按钮
    let actionHtml = '';
    if (isPending) {
      actionHtml = `
        <div class="node-actions">
          <button class="btn-confirm" onclick="confirmNode('${node.recordId}', 'confirm')">确 认 通 过</button>
          <button class="btn-revise" onclick="toggleReviseBox('${node.recordId}')">提出修改</button>
        </div>
        <div class="revise-box" id="revise-${node.recordId}">
          <textarea class="revise-textarea" id="reviseText-${node.recordId}" placeholder="请描述您希望修改的内容..."></textarea>
          <button class="revise-submit" onclick="confirmNode('${node.recordId}', 'revise')">提 交 修 改 意 见</button>
        </div>
      `;
    } else if (node.status === '已确认') {
      actionHtml = `<div style="margin-top:8px; font-size:13px; color:var(--success); font-weight:600;">已确认此节点</div>`;
    } else if (node.status === '有修改意见') {
      actionHtml = `<div style="margin-top:8px; padding:10px 12px; background:var(--gold-pale); border-radius:8px; font-size:13px; color:#6B4E2E;"><span style="font-weight:600;">修改意见：</span>${node.clientNotes || '已提交'}</div>`;
    }

    return `
      <div class="timeline-item ${statusCls}">
        <div class="node-card">
          <div class="node-header">
            <div class="node-name">${node.nodeName || node.stage}</div>
            <div class="node-status ${statusBadge}">${node.status || '待确认'}</div>
          </div>
          ${node.description ? `<div class="node-desc">${node.description}</div>` : ''}
          ${attachHtml}
          <div class="node-time">${formatTime(node.uploadTime)}</div>
          ${node.uploader ? `<div class="node-uploader">上传人：${node.uploader}</div>` : ''}
          ${actionHtml}
        </div>
      </div>
    `;
  }

  // ===== 确认/修改 =====
  function toggleReviseBox(recordId) {
    const box = document.getElementById(`revise-${recordId}`);
    box.classList.toggle('show');
  }

  function confirmNode(recordId, action) {
    let body = { recordId, action };

    if (action === 'revise') {
      const notes = document.getElementById(`reviseText-${recordId}`).value.trim();
      if (!notes) {
        showToast('请填写修改意见');
        return;
      }
      body.clientNotes = notes;
    }

    fetch(`${API_BASE}/api/confirm`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          let msg = data.message;
          if (data.advanceInfo) {
            msg = `已确认！项目已推进至「${data.advanceInfo.to}」阶段`;
          }
          showToast(msg);
          // 刷新页面
          setTimeout(() => {
            const phone = localStorage.getItem('lihe_phone');
            if (phone) doLogin();
          }, 2000);
        } else {
          showToast(data.error || '操作失败');
        }
      })
      .catch(err => {
        showToast('网络错误，请稍后重试');
      });
  }

  // ===== 图片查看 =====
  function viewImage(url) {
    const img = document.getElementById('viewerImg');
    img.classList.remove('loaded');
    img.src = url;
    document.getElementById('imageViewer').classList.add('show');
  }
  function closeViewer() {
    document.getElementById('imageViewer').classList.remove('show');
  }
  function previewFile(url) {
    if (url) window.open(url, '_blank');
    else showToast('文件链接已过期，请刷新页面');
  }

  function getAttachmentIcon(name, type) {
    if (!name) return { icon: 'FILE', label: '文件' };
    const ext = name.toLowerCase().split('.').pop();
    const map = {
      'pdf': { icon: 'PDF', label: 'PDF' },
      'doc': { icon: 'DOC', label: 'Word' }, 'docx': { icon: 'DOC', label: 'Word' },
      'ppt': { icon: 'PPT', label: 'PPT' }, 'pptx': { icon: 'PPT', label: 'PPT' },
      'xls': { icon: 'XLS', label: 'Excel' }, 'xlsx': { icon: 'XLS', label: 'Excel' },
      'dwg': { icon: 'CAD', label: 'CAD' }, 'dxf': { icon: 'CAD', label: 'CAD' },
      'zip': { icon: 'ZIP', label: 'ZIP' }, 'rar': { icon: 'ZIP', label: 'RAR' },
      'mp4': { icon: 'MP4', label: '视频' }, 'mov': { icon: 'MP4', label: '视频' },
    };
    return map[ext] || { icon: 'FILE', label: '文件' };
  }

  // ===== 工具函数 =====
  function formatTime(timestamp) {
    if (!timestamp) return '';
    const d = new Date(timestamp);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function pad(n) { return n < 10 ? '0' + n : n; }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  function logout() {
    localStorage.removeItem('lihe_phone');
    localStorage.removeItem('lihe_role');
    window.location.href = '/login.html';
  }

  // ===== 演示模式（API未部署时） =====
  function showDemoPage(phone) {
    const demoProjects = [{
      recordId: 'demo1',
      name: '张先生住宅',
      code: 'LH-2508-001',
      spaceType: '别墅',
      area: 320,
      address: '汕头市龙湖区',
      stage: '施工-泥木',
      progress: 55,
      status: '正常',
      designLead: 'D-01',
      projectLead: 'P-01',
    }];

    const demoNodes = [
      { recordId: 'n1', projectId: 'demo1', stage: '概念方案', nodeName: '概念方案确认', status: '已确认', uploadTime: Date.now() - 30*86400000, description: '初步概念方案，已与客户确认设计方向', attachments: [], uploader: 'D-01' },
      { recordId: 'n2', projectId: 'demo1', stage: '深化方案', nodeName: '深化方案确认', status: '已确认', uploadTime: Date.now() - 20*86400000, description: '完整施工图深化方案', attachments: [], uploader: 'D-01' },
      { recordId: 'n3', projectId: 'demo1', stage: '施工-拆除水电', nodeName: '水电验收', status: '已确认', uploadTime: Date.now() - 10*86400000, description: '水电隐蔽工程完工验收', attachments: [], uploader: 'P-01' },
      { recordId: 'n4', projectId: 'demo1', stage: '施工-泥木', nodeName: '泥木中间验收', status: '待确认', uploadTime: Date.now() - 2*86400000, description: '泥木工程中间节点，请确认施工质量', attachments: [], uploader: 'P-01' },
    ];

    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';

    const area = document.getElementById('contentArea');
    area.innerHTML = renderProjectCard(demoProjects[0]);
    renderNodes(document.getElementById('nodes-demo1'), demoNodes, demoProjects[0]);

    // 演示模式拦截确认操作
    window._demoMode = true;
    window.confirmNode = function(recordId, action) {
      if (action === 'revise') {
        const box = document.getElementById(`revise-${recordId}`);
        if (box) box.classList.toggle('show');
        const submitBtn = box?.querySelector('.revise-submit');
        if (submitBtn) {
          submitBtn.onclick = () => {
            showToast('演示模式：修改意见已模拟提交');
            setTimeout(() => box.classList.remove('show'), 1500);
          };
        }
        return;
      }
      showToast('演示模式：确认操作已模拟');
      const node = demoNodes.find(n => n.recordId === recordId);
      if (node) node.status = '已确认';
      renderNodes(document.getElementById('nodes-demo1'), demoNodes, demoProjects[0]);
    };
  }

  // ===== 自动登录 =====
  window.addEventListener('load', () => {
    const savedPhone = localStorage.getItem('lihe_phone');
    if (savedPhone) {
      document.getElementById('phoneInput').value = savedPhone;
      doLogin();
    }
  });
</script>
